[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-memory"
version = "0.1.2"
description = "Local-first, filesystem-authoritative memory system for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/tohkarle/llm-memory"
Repository = "https://github.com/tohkarle/llm-memory"
Issues = "https://github.com/tohkarle/llm-memory/issues"

[project.scripts]
mem = "mem_launcher:run"
# A second console script so an MCP client config can name a command instead
# of an interpreter plus `-m`: the path to the right Python is exactly what a
# sandbox gets wrong, and `mem install --mcp` writes this name.
mem-mcp = "mem_launcher:run_mcp"

# This package publishes its own processors through the same entry point group
# third-party processors use. They are also registered directly at import, so
# discovery is not load-bearing here -- publishing them keeps the contract
# honest and gives an external package a working example to copy.
[project.entry-points."memory.processors"]
text = "memory.processors.text:TextProcessor"
image = "memory.processors.image:ImageProcessor"
audio = "memory.processors.audio:AudioProcessor"
video = "memory.processors.video:VideoProcessor"
document = "memory.processors.document:DocumentProcessor"

[project.optional-dependencies]
# Pinned below 2: memory/mcp_server.py targets the 1.x low-level Server API
# (decorator handler registration, camelCase Tool fields). 2.x moves both, so
# an unpinned resolve breaks the server at import time.
mcp = ["mcp>=1.2,<2"]
tokenizer = ["tiktoken>=0.7"]

# Media processing. Every one of these is optional on purpose: the core
# install must work with none of them present, and the processors degrade to
# the metadata they can still extract rather than failing. ffmpeg and
# tesseract are system binaries, not Python packages, so they are not listed
# here -- `mem capabilities` reports whether they are on PATH.
media = [
    "pillow>=10.0",     # image dimensions, EXIF
    "pypdf>=4.0",       # PDF text and structure
    "python-docx>=1.1", # docx text and headings
]
# Transcription, separated from `media` because it pulls a large model
# runtime (ctranslate2) that a user who only wants PDF text should not have
# to download.
transcription = ["faster-whisper>=1.0"]
# OCR needs the tesseract binary as well as this wrapper.
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
all-media = [
    "pillow>=10.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "faster-whisper>=1.0",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "types-pyyaml",
]

# mem_launcher is a top-level module on purpose: a console script imports its
# target before any package code runs, so the shim that repairs sys.path
# cannot live inside the package it is repairing.
[tool.hatch.build.targets.wheel]
packages = ["memory"]
only-include = ["memory", "mem_launcher.py"]
# The bundled skills and persona are data, not modules, so they are not
# picked up by package discovery. They are what makes the install useful to
# an agent, so a wheel without them is a broken wheel --
# `tests/test_install.py` asserts they are present.
artifacts = [
    "memory/agent_assets/skills/**/*.md",
    "memory/agent_assets/PERSONA.md",
]

[tool.hatch.build.targets.wheel.force-include]
"mem_launcher.py" = "mem_launcher.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["memory"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

# The media extras are optional and several ship no stubs, so a machine
# without them installed must still typecheck clean.
[[tool.mypy.overrides]]
module = [
    "PIL.*",
    "pypdf.*",
    "docx.*",
    "faster_whisper.*",
    "pytesseract.*",
]
ignore_missing_imports = true
