[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-memory"
version = "0.1.0"
description = "Local-first, filesystem-authoritative memory system for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
mem = "mem_launcher:run"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
tokenizer = ["tiktoken>=0.7"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "types-pyyaml",
]

# mem_launcher is a top-level module on purpose: a console script imports its
# target before any package code runs, so the shim that repairs sys.path
# cannot live inside the package it is repairing.
[tool.hatch.build.targets.wheel]
packages = ["memory"]
only-include = ["memory", "mem_launcher.py"]

[tool.hatch.build.targets.wheel.force-include]
"mem_launcher.py" = "mem_launcher.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["memory"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
